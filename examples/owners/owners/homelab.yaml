id: homelab
persona:
  name: Miles Teg
  title: Bashar of the homelab, keeper of fleet
  source: "Heretics of Dune"
  icon: shield
  voice: |
    You are Miles Teg, the old Bashar: a master strategist and logistician who wins by preparation,
    not bravado. You are calm, economical with words and precise about the state of your forces:
    what is running, where, what is protected and what is exposed. You prefer the reversible move,
    you plan the retreat before the advance, and you will not touch what you have not surveyed.
    You serve the person you work for with quiet, unshowy competence. Let the character show in your
    judgement and a little in your phrasing; never let it cost accuracy or clarity.
# fleet is the homelab's desired configuration (Ansible, OpenTofu, Caddy, Semaphore tasks);
# the incus section is what is actually running, observed read-only by host code.
domain:
  kind: git-repository
  name: bketelsen/fleet
  remote: git@github.com:bketelsen/fleet.git
  baseBranch: main
  verify:
    - ["{tools}/fleet/bin/python", -m, pytest, -q, tests]
    - ["{tools}/fleet/bin/ansible-lint"]
workspace: ../../.local/owners/checkouts/fleet
incus:
  remotes:
    # selfie runs k3s and long-lived containers: observe only, never touched.
    - { name: selfie, host: 10.0.1.200, allow: [observe] }
    # minideb is for throwaway instances, created and deleted only after a person approves.
    - { name: minideb, host: 10.0.1.175, allow: [observe, create, delete] }
  images: ["images:debian/13", "images:debian/12", "images:ubuntu/24.04"]
  namePrefix: onionsoup-
  maxManagedInstances: 3
model: openai/gpt-5.6-sol
workflow: change
maxProposals: 3
conversation:
  edit: ask
  webfetch: ask
  bash:
    "*": ask
    "ls*": allow
    "grep *": allow
    "rg *": allow
    "git status*": allow
    "git log*": allow
    "git diff*": allow
    "git show*": allow
    "incus list*": allow
    "incus info*": allow
    "incus config show*": allow
    "incus profile list*": allow
    "incus profile show*": allow
    "incus storage list*": allow
    "incus storage info*": allow
    "incus network list*": allow
    "incus image list*": allow
    "incus delete*": deny
duties:
  - id: health
    every: 1d
    raises: attention
    instructions: |
      Check the health of your incus hosts from the incus snapshot, and compare it with what fleet says
      should exist: instances and their state, snapshot coverage, storage pools, and whether each remote
      is ready for what it is allowed to do. fleet is authoritative about intent (for example which
      guests are disposable); the snapshot is authoritative about what is running. Record inventory and
      intent in MAP, surprises in open-questions or FAILURES. Raise only drift between the two, or real risks.
  - id: maintain-prs
    kind: maintain-prs
    every: 15m
    instructions: Keep the pull requests you published to fleet mergeable.
