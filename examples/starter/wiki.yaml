# A wiki onionsoup serves on the localhost surface and one owner keeps. Uncomment to turn it on; while every line is a comment
# there is no wiki. See docs/extending.md ("Keep a wiki").
#
# repository: git@github.com:you/homewiki.git   # the git remote each write is pushed to, as the backup
# branch: main                                  # default main
# pagesDirectory: docs                          # where the markdown pages live in the repository (default docs)
# The surface serves the wiki at /wiki/ on its existing localhost listener.
# keeper: example                               # the one owner who writes pages; everyone else reads
